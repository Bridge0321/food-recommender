<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="依照偏好找到今晚最適合的美食。" />
    <title>今晚吃什麼？</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <div class="hero-bar">
          <div><p class="eyebrow">FOOD FINDER</p><h1>今晚吃什麼？</h1></div>
          <div class="hero-actions">
            <button id="shortlist-button" class="shortlist-button" type="button" aria-expanded="false" aria-controls="shortlist-panel" aria-label="查看待選餐廳">☆<span id="shortlist-count">0</span></button>
            <button id="settings-button" class="settings-button" type="button" aria-expanded="false" aria-controls="filter-form" aria-label="開啟設定">☰</button>
          </div>
        </div>
        <p class="hero-copy">左右滑動，快速決定今晚吃什麼。</p>
      </header>

      <section class="app-layout" aria-label="美食推薦器">
        <div id="settings-backdrop" class="settings-backdrop" hidden></div>
        <form id="filter-form" class="filter-panel" hidden>
          <div class="panel-heading">
            <div>
              <p class="section-kicker">你的偏好</p>
              <h2>設定條件</h2>
            </div>
            <button id="reset-button" class="text-button" type="button">重設</button>
          </div>

          <label class="field">
            <span>餐廳種類</span>
            <select id="category" name="category">
              <option value="all">不限</option>
              <option value="中式">中式</option>
              <option value="西式">西式</option>
              <option value="日式">日式</option>
              <option value="韓式">韓式</option>
              <option value="泰式">泰式</option>
              <option value="越式">越式</option>
              <option value="速食">速食</option>
              <option value="甜點">甜點</option>
              <option value="其他">其他</option>
            </select>
          </label>

          <label class="field">
            <span>到店時間</span>
            <output id="travel-time-value" class="range-value" for="travel-time">不設上限</output>
            <input id="travel-time" name="travelTime" type="range" min="10" max="60" step="5" value="60" />
            <small>最快可到時間</small>
          </label>

          <label class="field">
            <span>每人預算</span>
            <output id="budget-value" class="range-value" for="budget">不設上限</output>
            <input id="budget" name="budget" type="range" min="100" max="1000" step="50" value="1000" />
            <small>每人可接受的最高金額</small>
          </label>

          <label class="toggle-row" for="open-now">
            <span>
              <strong>只顯示營業中</strong>
              <small>先避開撲空的店</small>
            </span>
            <input id="open-now" name="openNow" type="checkbox" checked />
            <span class="toggle" aria-hidden="true"></span>
          </label>

          <button class="recommend-button" type="submit">套用設定</button>
          <button id="location-button" class="location-button" type="button">📍 依我的位置找附近美食</button>
          <p id="travel-status" class="travel-status">目前顯示的是示範資料；按上方按鈕後會搜尋 Google Maps 的附近店家。</p>
        </form>

        <section class="results-panel" aria-live="polite">
          <div class="results-heading">
            <div>
              <p class="section-kicker">推薦結果</p>
              <h2 id="results-title">正在幫你挑選</h2>
            </div>
            <p id="result-count" class="result-count"></p>
          </div>

          <article id="top-pick" class="top-pick" hidden></article>
          <div id="swipe-deck" class="swipe-deck" aria-label="滑卡選餐"></div>
          <div id="swipe-actions" class="swipe-actions">
            <button id="skip-button" class="swipe-action skip-action" type="button" aria-label="略過這間餐廳">✕<span>略過</span></button>
            <button id="star-button" class="swipe-action star-action" type="button" aria-label="加入待選餐廳">☆<span>待選</span></button>
            <button id="choose-button" class="swipe-action choose-action" type="button" aria-label="選定這間餐廳">♥<span>選這間</span></button>
          </div>
          <p id="swipe-hint" class="swipe-hint">向左滑略過，向右滑選定</p>
          <section id="shortlist-panel" class="shortlist-panel" hidden></section>
          <section id="map-panel" class="map-panel" aria-label="推薦餐廳地圖"></section>
          <section id="comparison-panel" class="comparison-panel" hidden></section>
        </section>
      </section>
    </main>

    <script src="restaurants.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
